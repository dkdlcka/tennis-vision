[project]
name = "tennis-vision"
version = "0.1.0"
description = "Analyze tennis match videos: ball tracking, in/out calls, automatic scoring"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
tennis-analyze = "tennis_vision.pipeline:main"

[tool.setuptools]
packages = ["tennis_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
